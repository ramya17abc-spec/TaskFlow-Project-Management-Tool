spring:
  application:
    name: taskflow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: always
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-this-to-a-long-random-secret-before-deploying-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  seed-demo: ${SEED_DEMO:true}
logging:
  level:
    org.springframework.security: INFO
