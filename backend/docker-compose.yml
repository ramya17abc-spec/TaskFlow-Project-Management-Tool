services:
  mysql:
    image: mysql:8.4
    container_name: taskflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - taskflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    container_name: taskflow-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflow_dev
      JWT_SECRET: local-compose-only-change-this-secret-before-deploying-123456789
      JWT_EXPIRATION_MS: 3600000
      FRONTEND_ORIGIN: http://localhost:3000
      SEED_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  taskflow_mysql_data:
